<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ujana Send Support (demo)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 1.5rem auto;
           padding: 0 1rem; color: #1a1a1a; }
    .notice { background: #fff8e1; border: 1px solid #f0d78c; padding: .6rem .8rem;
              border-radius: 8px; font-size: .9rem; }
    #log { margin: 1rem 0; min-height: 260px; }
    .msg { padding: .5rem .75rem; border-radius: 10px; margin: .4rem 0;
           max-width: 85%; white-space: pre-wrap; }
    .user { background: #e8f0fe; margin-left: auto; }
    .bot { background: #f1f3f4; }
    .row { display: flex; gap: .5rem; }
    #box { flex: 1; padding: .6rem; font-size: 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; }
    footer { margin-top: 1.5rem; font-size: .85rem; color: #555; }
  </style>
</head>
<body>
  <h1>Ujana Send Support</h1>
  <p class="notice">
    Demo only: Ujana Send is a fictional company, and this assistant can't
    see accounts or transfers. Please don't enter real personal or financial details.
  </p>

  <div id="log"></div>

  <div class="row">
    <input id="box" placeholder="Type your question..." maxlength="2000" autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

  <footer><a href="/stats">View demo statistics</a></footer>

  <script>
    let sessionId = localStorage.getItem("session_id");

    const log = document.getElementById("log");
    const box = document.getElementById("box");
    const button = document.getElementById("sendBtn");

    function addLine(kind, text) {
      const p = document.createElement("p");
      p.className = "msg " + kind;
      p.textContent = text;
      log.appendChild(p);
      p.scrollIntoView({ block: "end" });
    }

    async function send() {
      const text = box.value.trim();
      if (!text) return;
      box.value = "";
      addLine("user", text);
      button.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });
        const data = await res.json();

        if (!res.ok) {
          if (res.status === 404) {
            // The server doesn't know this session (e.g. it restarted)
            localStorage.removeItem("session_id");
            sessionId = null;
            addLine("bot", "Your previous session expired. Please send your message again.");
          } else if (typeof data.detail === "string") {
            addLine("bot", data.detail);
          } else {
            addLine("bot", "Sorry, I couldn't read that message. Please try rewording it.");
          }
          return;
        }

        sessionId = data.session_id;
        localStorage.setItem("session_id", sessionId);
        addLine("bot", data.reply);
      } catch (err) {
        addLine("bot", "I couldn't reach the server. Please check your connection and try again.");
      } finally {
        button.disabled = false;
        box.focus();
      }
    }

    button.addEventListener("click", send);
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });

    addLine("bot", "Hi, I'm Ujana, the support assistant for Ujana Send. I can help with fees, limits, transfer times, verification and failed transfers. What can I help you with today?");
    box.focus();
  </script>
</body>
</html>
